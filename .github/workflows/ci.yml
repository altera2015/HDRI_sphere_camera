name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;29.0.14206865" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleDebug
