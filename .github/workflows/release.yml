name: Release

# Builds a signed release APK when a version tag (v1.2.3) is pushed and attaches it to a GitHub release.
#
# Signing uses these repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64    base64 of the .jks keystore (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD  keystore password
#   RELEASE_KEY_ALIAS          key alias
#   RELEASE_KEY_PASSWORD       key password
# Without them the APK is built unsigned (it cannot be installed until signed).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;29.0.14206865" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets configured; building an unsigned APK."
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:testReleaseUnitTest :app:assembleRelease

      - name: Collect APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          suffix=""
          case "$apk" in *unsigned*) suffix="-unsigned" ;; esac
          mkdir -p dist
          cp "$apk" "dist/HDRI-Sphere-$GITHUB_REF_NAME$suffix.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
